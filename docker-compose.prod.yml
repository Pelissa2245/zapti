# ZapTI Production Docker Compose Override
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.8'

services:
  api:
    environment:
      - CORS_ORIGIN=http://192.168.1.141:3001
      - FRONTEND_URL=http://192.168.1.141:3001

  web:
    build:
      args:
        - NEXT_PUBLIC_API_URL=http://zapti-api:3000/api/v1
    environment:
      - NEXT_PUBLIC_API_URL=http://zapti-api:3000/api/v1
