version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zapti-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zapti
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zapti-network

  redis:
    image: redis:7-alpine
    container_name: zapti-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zapti-network

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: zapti-evolution
    environment:
      NODE_ENV: production
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      CORS_ORIGIN: "*"
      CORS_METHODS: "POST,GET,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: "info"
      LOG_COLOR: "true"
      LOG_BEAUTY: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://postgres:postgres@postgres:5432/zapti?schema=evolution"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution"
      DATABASE_CONNECTION_SAVE_DATA_INSTANCE: "true"
      DATABASE_CONNECTION_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_CONNECTION_SAVE_DATA_UPDATE_MESSAGE: "true"
      DATABASE_CONNECTION_SAVE_DATA_CONTACTS: "true"
      DATABASE_CONNECTION_SAVE_DATA_CHATS: "true"
      DATABASE_CONNECTION_SAVE_DATA_LABELS: "true"
      DATABASE_CONNECTION_SAVE_DATA_HISTORIC: "true"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://redis:6379"
      REDIS_PREFIX: "evolution"
      REDIS_SAVE_INSTANCES: "true"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-zapti-evolution-key-change-in-production}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      CHATWOOT_ENABLED: "false"
      SQS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WHATSAPP_BUSINESS_ENABLED: "true"
      WHATSAPP_BUSINESS_API_URL: "https://graph.facebook.com"
      WHATSAPP_BUSINESS_API_VERSION: "v18.0"
      WHATSAPP_BUSINESS_API_TOKEN: "${WHATSAPP_BUSINESS_API_TOKEN:-}"
      WHATSAPP_BUSINESS_API_PHONE_NUMBER_ID: "${WHATSAPP_BUSINESS_API_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_API_VERIFY_TOKEN: "${WHATSAPP_BUSINESS_API_VERIFY_TOKEN:-}"
      WHATSAPP_BUSINESS_API_APP_SECRET: "${WHATSAPP_BUSINESS_API_APP_SECRET:-}"
      WHATSAPP_WEBHOOK_ENABLED: "true"
      WHATSAPP_WEBHOOK_URL: "http://api:3000/webhooks/evolution"
      WHATSAPP_WEBHOOK_EVENTS: "messages.upsert,messages.update,contacts.upsert,chats.upsert,instance.update,connection.update,qrcode.updated"
      WHATSAPP_WEBHOOK_RETRIES: "3"
      WHATSAPP_WEBHOOK_DELAY: "1000"
      MEDIA_PATH: "/media"
      MEDIA_MAX_SIZE: "104857600"
      MEDIA_ALLOWED_TYPES: "image/*,video/*,audio/*,application/pdf"
    ports:
      - "8080:8080"
    volumes:
      - evolution_media:/media
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - zapti-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zapti-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapti?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-webhook-verify-token}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-zapti-evolution-key-change-in-production}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-zapti}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zapti-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zapti-web
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      NEXT_PUBLIC_EVOLUTION_API_URL: http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - zapti-network

volumes:
  postgres_data:
  redis_data:
  evolution_media:
  evolution_instances:

networks:
  zapti-network:
    driver: bridge